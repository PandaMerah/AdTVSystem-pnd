name: Build AdTV Kiosk APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'TV APK/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TV APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug & Release APKs
        env:
          ADTV_SERVER_URL: ${{ vars.ADTV_SERVER_URL }}
        run: gradle assembleDebug assembleRelease

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adtv-kiosk-apk
          path: |
            TV APK/app/build/outputs/apk/debug/*.apk
            TV APK/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

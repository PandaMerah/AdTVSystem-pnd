services:
  adtv-webpanel:
    build: .
    container_name: adtv-webpanel
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change-me-strong-password
      - AUTH_SECRET=change-me-long-random-secret
    volumes:
      - adtv_data:/app/data

volumes:
  adtv_data:
